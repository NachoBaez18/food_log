name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Generate Android scaffold without modifying app or tests
        run: |
          scaffold="$(mktemp -d)"
          flutter create --no-pub --platforms=android --org com.foodlog --project-name foodlog "$scaffold"
          if [ ! -d android ]; then
            cp -R "$scaffold/android" android
          fi
          if [ ! -f .metadata ]; then
            cp "$scaffold/.metadata" .metadata
          fi
          git diff --exit-code -- lib test pubspec.yaml
          test -z "$(git status --porcelain -- lib test pubspec.yaml)"
          grep -q 'MealType.suggest' test/widget_test.dart
      - name: Apply FoodLog branding
        run: |
          python3 -m pip install Pillow
          python3 scripts/brand_android.py
      - run: flutter clean
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: foodlog-apk
          path: build/app/outputs/flutter-apk/app-release.apk
